<text x="570.0" y="130.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">from role_v2 = train</text>
<rect x="690.0" y="80.0" width="250.0" height="64.0" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.4"/>
<text x="815.0" y="102.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">held-out fold k</text>
<text x="815.0" y="116.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">scored once → CV F1</text>
<text x="815.0" y="130.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">+ synthetic multi-line posts</text>
<line x1="230.0" y1="112.0" x2="248.0" y2="112.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
