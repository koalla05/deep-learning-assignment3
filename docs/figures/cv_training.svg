<text x="350.0" y="116.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">63,388 rows (uk 31,432 · ru 31,956)</text>
<text x="350.0" y="130.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">fold k held out</text>
<rect x="470.0" y="80.0" width="200.0" height="64.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
