<text x="480.0" y="414.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">saved per model: logits (O, B, I per token) + CRF transitions</text>
<text x="480.0" y="428.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">splits: inner · heldout · synthetic posts · 26 labeled posts · 477 test posts</text>
<text x="480.0" y="442.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">plus tokenizer.json and model.pt, so any ensemble is rebuilt without retraining</text>
<line x1="460.0" y1="352.0" x2="460.0" y2="390.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
