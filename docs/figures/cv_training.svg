<text x="460.0" y="324.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">≤ 10 epochs, patience 3 on inner F1, best epoch restored</text>
<text x="460.0" y="338.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">Lightning; curves to W&amp;B</text>
<line x1="460.0" y1="248.0" x2="460.0" y2="286.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
